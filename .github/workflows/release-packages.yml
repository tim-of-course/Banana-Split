name: Build release packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - run: npm run check
      # This checks source behavior on Linux, not supported-platform acceptance.
      - run: npm test -- --timeout 30000
      - run: npm run package:release
      - uses: actions/upload-artifact@v7
        with:
          name: banana-split-release-packages
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
