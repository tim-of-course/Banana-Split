name: Build release packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - run: npm run check
      # Source and package smoke checks do not run authenticated model workflows.
      - run: npm test -- --timeout 30000
      - run: npm run package:release
      - name: Smoke-test the extracted Linux package
        run: |
          mkdir -p .banana-test/release-smoke
          tar -xzf dist/releases/banana-split-*-linux-x64.tar.gz -C .banana-test/release-smoke
          bun scripts/smoke-package.ts .banana-test/release-smoke/bun-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: banana-split-release-packages
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
